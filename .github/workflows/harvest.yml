name: Weekly Archive Harvest

on:
  schedule:
    # Every Monday at 04:17 UTC (off-minute to avoid CF/GH peak)
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max records per source per location (default 50, aggressive 150)'
        required: false
        default: '50'
        type: string
      mode:
        description: 'Harvest mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - aggressive

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet aiohttp

      - name: Create data dir and fetch EDH dump
        working-directory: harvester
        run: |
          mkdir -p data
          curl -sSL -o data/edh-geo.json \
            "https://raw.githubusercontent.com/epigraphic-database-heidelberg/data/master/geography/edhGeographicData.json"
          ls -lh data/

      - name: Run harvest with upload
        working-directory: harvester
        env:
          SUPABASE_URL: https://frsgzfzvdxswqjpdmcsd.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HARVEST_LIMIT: ${{ github.event.inputs.limit || '50' }}
          HARVEST_MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: |
          echo "Harvest mode: $HARVEST_MODE, limit per source/location: $HARVEST_LIMIT"
          python3 search.py --harvest --limit "$HARVEST_LIMIT" --upload \
            --source europeana --source internet_archive --source edh \
            --source pelagios --source wikidata --source gallica \
            --source loc --source wellcome --source crossref --source openlibrary \
            --source bsb --source slub --source manus --source hathitrust --source anno \
            --source openaire --source openalex --source doaj --source zenodo \
            --source core --source rumsey --source ape 2>&1 | tee harvest.log

      - name: Enrich empty snippets
        working-directory: harvester
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 enrich_snippets.py 2>&1 | tee enrich.log
        continue-on-error: true

      - name: Extract full-text for new texts/books
        working-directory: harvester
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 extract_fulltext.py 2>&1 | tee fulltext.log
        continue-on-error: true

      - name: Mention analyzer — count, page, topic per record with full_text
        working-directory: harvester
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 mention_analyzer.py 2>&1 | tee mentions.log
        continue-on-error: true

      - name: Audit relevance — auto-delete records without Ulcinj anchor
        working-directory: harvester
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 audit_relevance.py --apply 2>&1 | tee audit.log
          # Hard-delete what audit flagged this run
          curl -s -X DELETE "https://frsgzfzvdxswqjpdmcsd.supabase.co/rest/v1/archive_results?metadata->>hidden_reason=eq.relevance_audit" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" \
            -i 2>&1 | grep -E 'HTTP|content-range' | tee -a audit.log
        continue-on-error: true

      - name: Upload all logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-logs-${{ github.run_id }}
          path: |
            harvester/harvest.log
            harvester/enrich.log
            harvester/fulltext.log
            harvester/mentions.log
            harvester/audit.log
          retention-days: 30
